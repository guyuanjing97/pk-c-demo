.list-search{height:46px;border-radius:16px;background:#FFFFFF0B;border:1px solid #FFFFFF12;display:flex;align-items:center;gap:9px;padding:0 13px;margin-bottom:10px}
.list-search .search-ico{width:18px;height:18px;opacity:.72;flex:0 0 auto}

.list-search input::placeholder{color:#7F8CAD}

/* V6.2 review navigation + room/list/contact refinements */
.review-nav{position:fixed;z-index:150;right:20px;top:20px;width:218px;max-height:calc(100vh - 40px);overflow:auto;padding:12px;border-radius:18px;background:#0D1430F2;border:1px solid #718CDB33;box-shadow:0 20px 55px #0007;backdrop-filter:blur(16px);color:#EAF0FF}
.review-nav::-webkit-scrollbar{width:5px}.review-nav::-webkit-scrollbar-thumb{background:#5A6A9455;border-radius:4px}
.review-nav-head{padding:4px 5px 10px;border-bottom:1px solid #FFFFFF10}.review-nav-head b{display:block;font-size:13px}.review-nav-head span{display:block;font-size:9px;color:#8796BB;margin-top:3px}
.review-step{width:100%;display:grid;grid-template-columns:28px 1fr;align-items:center;gap:7px;padding:7px 7px;border-radius:10px;margin-top:3px;text-align:left;color:#AEB9D5;font-size:10px}
.review-step .no{width:24px;height:24px;border-radius:8px;background:#FFFFFF08;display:grid;place-items:center;color:#8494BB;font-size:9px;font-weight:900}
.review-step:hover{background:#FFFFFF08}.review-step.active{background:linear-gradient(90deg,#4D8DFF25,#7659FF16);color:#fff}.review-step.active .no{background:#4D8DFF;color:#fff}

.hall-event{padding:14px 14px 12px;position:relative;overflow:hidden;margin-bottom:12px}

.create-room-btn{height:38px;padding:0 12px;border-radius:13px;background:linear-gradient(135deg,#FFD64E,#FF8D20);color:#fff;font-size:11px;font-weight:950;white-space:nowrap;box-shadow:0 8px 20px #FF982638}
.create-room-btn:disabled{opacity:.5;box-shadow:none}
.room-list-head{display:flex;align-items:center;justify-content:space-between;margin:16px 3px 8px}.room-list-head b{font-size:14px}.room-list-head span{font-size:9px;color:#8D9ABE}
.room-entry{padding:13px;border-radius:17px;background:linear-gradient(145deg,#182451E8,#101735E8);border:1px solid #718BDA26;margin-bottom:9px}
.room-entry-top{display:flex;align-items:center;justify-content:space-between}.room-entry-title{font-size:13px;font-weight:900}.room-entry-meta{font-size:9px;color:#8E9CBE;margin-top:4px}.room-entry-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:10px}

.join-now{height:36px;padding:0 12px;border-radius:12px;background:linear-gradient(135deg,#3A79FF,#6A59FF);font-size:10px;font-weight:900}
.contact-wrap{padding:0 2px}.contact-search{height:42px;border-radius:14px;background:#FFFFFF0A;border:1px solid #FFFFFF0E;display:flex;align-items:center;padding:0 12px;margin-bottom:9px;color:#91A0C1}.contact-search input{flex:1;background:transparent;border:0;outline:0;color:#fff;font-size:11px}.contact-search input::placeholder{color:#6F7F9F}
.contact-list{border-radius:18px;overflow:hidden;border:1px solid #FFFFFF0D;background:#FFFFFF04}

.embedded-room{padding:10px;border-radius:14px;background:#FFFFFF06;border:1px solid #FFFFFF0C;margin-top:7px}
.embedded-room-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.embedded-room-title{font-size:11px;font-weight:900}.embedded-room-meta{font-size:9px;color:#8291B2;margin-top:3px}

.embedded-duel{display:flex;align-items:center;gap:5px}

.embedded-vs{font-size:10px;font-weight:1000;color:#8398CB}
.embedded-action{height:32px;padding:0 10px;border-radius:10px;background:#4D8DFF18;border:1px solid #4D8DFF40;color:#9EC9FF;font-size:9px;font-weight:900}

/* BGM */
function ensureAudio(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}
function note(freq,dur=.13,vol=.018,type='triangle',delay=0){if(!S.music)return;ensureAudio();const t=audioCtx.currentTime+delay,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+dur+.02)}

function bgmBeat(){if(!S.music)return;const f=melody[bgmStep++%melody.length];note(f,.12,.017);if(bgmStep%4===0)note(f/2,.22,.009,'sine',.02)}
function startBgm(){if(!S.music||bgmTimer)return;ensureAudio();bgmBeat();bgmTimer=setInterval(bgmBeat,250)}
function stopBgm(){if(bgmTimer){clearInterval(bgmTimer);bgmTimer=null}}
function toggleMusic(){S.music=!S.music;if(S.music)startBgm();else stopBgm();const b=document.querySelector('.music');if(b){b.classList.toggle('on',S.music);b.classList.toggle('off',!S.music);b.textContent='♫';b.setAttribute('aria-label',S.music?'关闭背景音乐':'开启背景音乐')}}

function reviewJump(stage){
 clearFlow();closeModal();
 if(stage==='profile'){S.stage='profile';render();return}
 if(stage==='pkList'){S.stage='pkList';render();return}
 if(stage==='detail'){S.stage='detail';render();return}
 if(stage==='invite'){S.selectedInvites=[];S.stage='invite';render();return}
 if(stage==='hall'){S.stage='pkList';render();return}
 if(stage==='ownWaiting'){
   S.ownRoom={id:'review-room',invites:[candidates[0],candidates[1]],createdAt:Date.now()};
   S.stage='ownWaiting';render();clearFlow();return
 }
 if(['ready','countdown','question','waiting','result','win','lose','review'].includes(stage)){
   S.currentMatch=makeReviewMatch(stage!=='lose');
   if(stage==='ready'||stage==='countdown'){S.currentMatch.qi=0}
   if(stage==='question'){S.currentMatch.qi=1;S.currentMatch.qStartWall=Date.now()}
   if(stage==='waiting'){

   if(stage==='review'){S.reviewIndex=0}
   S.stage=stage;render();clearFlow();return
 }
}

function syncOfflineMatches(){
 const now=Date.now();
 S.ongoing.forEach(match=>{
  if(match.state!=='ongoing'||!match.myOffline)return;
  if(match.oppOffline){match.state='ended';return}
  const CYCLE=17000;
  let guard=0;
  while(match.qi<5 && now-match.qStartWall>=CYCLE && guard++<5){
   if(match.myAnswers[match.qi]===undefined){match.myAnswers[match.qi]=null;match.myTimes[match.qi]=15}
   if(match.oppAnswers[match.qi]===undefined){match.oppAnswers[match.qi]=qs[match.qi].opp;match.oppTimes[match.qi]=qs[match.qi].oppTime}
   settleScores(match,match.qi);
   match.qi++;match.qStartWall+=CYCLE;
  }
  if(match.qi>=5)match.state='ended';
 });
 S.ongoing=S.ongoing.filter(m=>m.state==='ongoing');
}

function choose(i){if(S.stage!=='question')return;document.querySelectorAll('.opt').forEach((e,j)=>{e.classList.toggle('sel',i===j);e.querySelector('.mark').textContent=i===j?'✓':''});S.currentMatch.tempSelected=i;document.getElementById('submitBtn').disabled=false}
function lockAnswer(timeout=false){
 const m=S.currentMatch;if(S.stage!=='question')return;clearFlow();
 const elapsed=Math.min(15,Math.max(.5,(Date.now()-m.qStartWall)/1000));
 m.myAnswers[m.qi]=timeout?null:m.tempSelected;m.myTimes[m.qi]=timeout?15:elapsed;delete m.tempSelected;
 const q=qs[m.qi];
 if(!m.oppOffline && (m.oppAnswers[m.qi]!==undefined || elapsed>=q.oppTime)){
   if(m.oppAnswers[m.qi]===undefined){m.oppAnswers[m.qi]=q.opp;m.oppTimes[m.qi]=q.oppTime}
   finishCurrentQuestion();return
 }
 trans('waiting');scheduleBothComplete()
}
function markMyTimeoutAndWait(){const m=S.currentMatch,q=qs[m.qi];m.myAnswers[m.qi]=null;m.myTimes[m.qi]=15;if(!m.oppOffline){m.oppAnswers[m.qi]=q.opp;m.oppTimes[m.qi]=q.oppTime;finishCurrentQuestion();return}trans('waiting');scheduleBothComplete()}
function scheduleBothComplete(){
 const m=S.currentMatch,q=qs[m.qi];
 const oppDue=m.oppOffline?15:q.oppTime;
 const elapsed=(Date.now()-m.qStartWall)/1000;
 const remain=Math.max(0,oppDue-elapsed);
 if(!m.oppOffline && m.oppAnswers[m.qi]===undefined){later(()=>{m.oppAnswers[m.qi]=q.opp;m.oppTimes[m.qi]=q.oppTime},remain*1000)}
 if(m.oppOffline){later(()=>{m.oppAnswers[m.qi]=null;m.oppTimes[m.qi]=15},remain*1000)}
 if(!m.oppOffline && m.myTimes[m.qi]!==null && m.myTimes[m.qi] < q.oppTime){
   later(()=>{if(S.stage==='waiting')finishCurrentQuestion()},Math.max(220,remain*1000+120));
 }else{
   later(()=>{if(S.stage==='waiting')finishCurrentQuestion()},Math.max(350,remain*1000+120));
 }
}

function waiting(){
 const m=S.currentMatch,q=qs[m.qi],oppDue=m.oppOffline?15:q.oppTime,elapsed=(Date.now()-m.qStartWall)/1000,remain=Math.max(0,oppDue-elapsed);
 html(`${spark(16)}${status()}${nav('答案已锁定')}<div class="page">${score(m)}${progress(m)}<div class="panel waiting"><div class="orb">${pkWaitingSvg()}</div><div class="wait-title">${m.oppOffline?'对手已离线':'等待对手完成本题'}</div><div class="wait-sub">${m.oppOffline?'本题仍会正常进行；对手未作答将按未作答处理':'你的答案已经锁定，不可修改'}</div><div id="waitRemain" class="wait-time">${remain>0?`预计还需 ${Math.ceil(remain)}s`:'正在汇总本题结果'}</div><div class="tip" style="text-align:left;margin-top:14px">我方答案：${m.myAnswers[m.qi]===null?'未作答':L[m.myAnswers[m.qi]]+' '+q.opts[m.myAnswers[m.qi]]}</div></div></div>`)
 const e=document.getElementById('waitRemain');tick=setInterval(()=>{const rr=Math.max(0,oppDue-(Date.now()-m.qStartWall)/1000);if(e)e.textContent=rr>0?`预计还需 ${Math.ceil(rr)}s`:'正在汇总本题结果'},1000)
}
function settleScores(m,i){
 if(m.scored?.[i])return;
 if(!m.scored)m.scored=[false,false,false,false,false];
 const q=qs[i],ma=m.myAnswers[i],oa=m.oppAnswers[i],mt=m.myTimes[i]??15,ot=m.oppTimes[i]??15;
 const mok=ma===q.correct,ook=oa===q.correct;let a=mok?10:-2,b=ook?10:-2;
 let speedA=0,speedB=0;if(mok&&ook){const d=ot-mt;if(d>0){speedA=Math.max(1,Math.min(5,Math.round(d/2)));a+=speedA}else if(d<0){speedB=Math.max(1,Math.min(5,Math.round((-d)/2)));b+=speedB}}
 m.myScore+=a;m.oppScore+=b;if(mok)m.myCorrect++;if(ook)m.oppCorrect++;m.last={mok,ook,a,b,speedA,speedB};m.scored[i]=true
}
function finishCurrentQuestion(){
 clearFlow();const m=S.currentMatch,q=qs[m.qi];
 if(m.oppAnswers[m.qi]===undefined){m.oppAnswers[m.qi]=m.oppOffline?null:q.opp;m.oppTimes[m.qi]=m.oppOffline?15:q.oppTime}
 settleScores(m,m.qi);trans('result')
}
function result(){
 const m=S.currentMatch,q=qs[m.qi],ma=m.myAnswers[m.qi],ok=ma===q.correct,last=m.last||{};
 html(`${spark(16)}${status()}${nav('本题结果')}<div class="page">${score(m)}${progress(m)}<div class="panel result"><div class="result-icon ${ok?'':'bad'}">${ok?'✓':'×'}</div><div class="result-title">${ok?'本题答对':'本题未得分'}</div><div class="delta">${last.a>0?'+':''}${last.a||0}</div><div class="compare"><div class="ans"><label>我的答案 · ${ok?'正确':'错误/未答'}</label><b style="color:#82B8FF">${ma===null?'未作答':L[ma]+' '+q.opts[ma]}</b></div><div class="ans"><label>对手答案</label><b style="color:#FF8B9B">${m.oppAnswers[m.qi]===null?'未作答':L[m.oppAnswers[m.qi]]+' '+q.opts[m.oppAnswers[m.qi]]}</b></div></div><div class="tip" style="text-align:left">正确答案将在比赛结束后的「答题回顾」中展示；本题结果不提前揭晓正确答案，也不展示对手是否正确。</div><div id="autoNext" class="auto"><strong>2秒后${m.qi===4?'进入对局结算':'进入下一题'}</strong></div></div></div>`)
 let n=2;const step=()=>{n--;if(n<=0){if(m.qi===4){trans(m.myScore>=m.oppScore?'win':'lose')}else{m.qi++;prepareQuestion()}return}const e=document.getElementById('autoNext');if(e)e.innerHTML=`<strong>${n}秒后${m.qi===4?'进入对局结算':'进入下一题'}</strong>`;later(step,1000)};later(step,1000)
}
/* exit / reconnect */
function showExitMatch(){openModal(`<h3>确定退出当前对局？</h3><p>退出后本场比赛仍会继续。你未完成的题目将按未作答处理；比赛结束前仍可以从 PK 房间列表重新进入。</p><button class="cta" onclick="closeModal()">继续比赛</button><button class="secondary" onclick="confirmLeaveMatch()">退出对局</button>`)}
function confirmLeaveMatch(){
 closeModal();clearFlow();const m=S.currentMatch;m.myOffline=true;m.leftAt=Date.now();S.reconnectPrompted=false;S.reconnectDismissed=false;
 if(m.oppOffline){m.state='ended';toast('双方均已退出，对局已结束');S.currentMatch=null;trans('pkList');return}
 if(!S.ongoing.some(x=>x.id===m.id))S.ongoing.unshift(m);
 S.currentMatch=null;trans('pkList')
}
function pendingReconnect(){return S.ongoing.find(m=>m.state==='ongoing'&&m.myOffline&&!m.oppOffline)}
function showPendingReconnectPrompt(){
 const m=pendingReconnect();
 if(!m||S.reconnectPrompted||S.reconnectDismissed||S.modal)return;
 S.reconnectPrompted=true;
 openModal(`<h3 style="text-align:center">提示</h3><p style="text-align:center;font-size:15px;color:#D8E3F7">您有尚未完成的PK赛正在进行，是否重新连接？</p><div class="modal-actions"><button class="modal-cancel" onclick="cancelReconnectPrompt()">取消</button><button class="modal-reconnect" onclick="tryRejoin('${m.id}')">重新连接</button></div>`,false)
}
function cancelReconnectPrompt(){S.reconnectDismissed=true;closeModal()}
function tryRejoin(id){
 const m=S.ongoing.find(x=>x.id===id);if(!m)return;
 if(S.ownRoom){openModal(`<h3>你已有等待中的房间</h3><p>重新进入旧对局前，需要先退出当前等待房间。</p><button class="cta" onclick="S.ownRoom=null;closeModal();tryRejoin('${id}')">退出当前房间并重新进入</button><button class="secondary" onclick="closeModal()">暂不进入</button>`);return}
 syncOfflineMatches();if(m.state==='ended'){toast('该对局已经结束');S.reconnectDismissed=true;render();return}
 S.currentMatch=m;m.myOffline=false;S.reconnectDismissed=false;S.reconnectPrompted=false;continueRejoin()
}
function continueRejoin(){
 closeModal();const m=S.currentMatch;
 if(m.qi>=5){trans(m.myScore>=m.oppScore?'win':'lose');return}
 const elapsed=(Date.now()-m.qStartWall)/1000;
 if(m.myAnswers[m.qi]!==undefined){trans('waiting');scheduleBothComplete()}
 else if(elapsed>=15){markMyTimeoutAndWait()}
 else prepareQuestion(true)
}

" stroke="#FFF0A4" stroke-width="3" stroke-linecap="round" opacity=".6"/></g><path d="M31 35l4 8 8 4-8 4-4 8-4-8-8-4 8-4 4-8ZM202 38l3 6 6 3-6 3-3 6-3-6-6-3 6-3 3-6Z" fill="#FFE78C"/></svg></div>`}

function win(){const m=S.currentMatch;html(`${spark(12)}${status()}${nav('对局结算',false)}<div class="page final"><div class="panel card"><div class="trophy">${goldCup()}</div><div class="final-title">胜利</div><div class="final-sub">本场对局已结束</div><div class="final-score"><span class="b">${m.myScore}</span><span class="colon">:</span><span class="r">${m.oppScore}</span></div><div class="stats"><div class="stat"><b>${m.myCorrect}/5</b><span>我的正确题数</span></div><div class="stat"><b>${m.oppCorrect}/5</b><span>对手正确题数</span></div><div class="stat"><b>+${m.myScore}</b><span>本局积分</span></div></div></div></div>${bottom('答题回顾','openReview()','再来一局','trans("pkList")')}`)}

function openReview(){S.reviewIndex=0;trans('review')}
function review(){
 const m=S.currentMatch,i=S.reviewIndex,q=qs[i],ma=m.myAnswers[i],ok=ma===q.correct;
 html(`${spark(6)}${status()}${nav('答题回顾')}<div class="page"><div class="review-head"><b>第 ${i+1} 题 / 共5题</b><span>${m.myScore} : ${m.oppScore}</span></div><div class="qnav">${qs.map((_,j)=>`<button class="${i===j?'active':''}" onclick="S.reviewIndex=${j};render()">${j+1}</button>`).join('')}</div><div class="panel q"><div class="qtitle">${q.q}</div>${q.opts.map((o,j)=>`<div class="opt ${j===q.correct?'correct':''} ${j===ma&&!ok?'wrong':''}"><span class="key">${L[j]}</span><span>${o}</span><span>${j===q.correct?'✓':j===ma&&!ok?'×':''}</span></div>`).join('')}<div class="review-answer"><div><label>我的答案</label><b class="${ok?'good':'bad'}">${ma===null||ma===undefined?'未作答':L[ma]+' '+q.opts[ma]}</b></div><div><label>正确答案</label><b class="good">${L[q.correct]} ${q.opts[q.correct]}</b></div></div><div class="tip">答题回顾从第1题开始，只保留「我的答案 + 正确答案」。</div></div></div>${reviewBottom()}`)
}
function reviewBottom(){if(S.reviewIndex===4)return bottom('返回PK赛列表','returnList()');if(S.reviewIndex===0)return bottom('下一题','S.reviewIndex++;render()');return bottom('下一题','S.reviewIndex++;render()','上一题','S.reviewIndex--;render()')}
function returnList(){S.currentMatch=null;trans('pkList')}
render();
